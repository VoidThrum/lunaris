[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Link FFmpeg statically (distro packages, see scripts/packaging/build-ffmpeg-static.sh).
static-ffmpeg = ["dep:ffmpeg-sys-next", "ffmpeg-sys-next/static"]

[dependencies]
common = { path = "../common" }
lunaris-media = { git = "https://github.com/collyn/lunaris-media.git" }
ffmpeg-sys-next = { version = "8.1", optional = true, default-features = false }
bitflags = "2"

tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls", "rustls-tls-native-roots"] }
native-tls = "0.2"
# Server connection: our own TLS handshake, to pin a self-signed server
# certificate on first use (lib.rs `server_tls`). Same versions and the ring
# backend that tokio-tungstenite and wtransport already use.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-native-certs = "0.8"
# SHA-256 of the server certificate, OS random source for passwords and keys.
ring = "0.17"
# direct.rs: the self-signed certificate of the direct-connection listener
# (already used by wtransport and webrtc, ring backend).
rcgen = "0.14"
webrtc = "0.21.1"
rtc = "0.21.1"
async-trait = "0.1"
webrtc-util = "0.17.1"
wtransport = { version = "0.7.1", features = ["self-signed"] }
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
anyhow = "1.0"
once_cell = "1.18"
thiserror = "2"
bytes = "1.0"
futures-util = "0.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
num-derive = "0.5"
num-traits = "0.2"
hostname = "0.4"
urlencoding = "2.1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "charset", "http2", "system-proxy", "json", "blocking", "stream"] }
dirs = "7"
# Clipboard sharing (X11, Wayland data-control, Windows, macOS).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
libc = "0.2"
# rustdesk.rs: RustDesk's wire messages (types generated by build.rs from
# proto/rustdesk/message.proto).
prost = "0.14"
# rustdesk/session.rs: RustDesk's own expressions for "the peer is an address".
regex = "1"
# rustdesk/session.rs: the send buffer of a session's socket (already a
# dependency of tokio).
socket2 = "0.6"
# rustdesk/cursor.rs, rustdesk/clipboard.rs: RustDesk compresses cursor
# pixels and clipboard text with zstd (hbb_common/src/compress.rs) and names
# cursor shapes by an xxh3 hash (rustdesk/src/common.rs cursor_content_id).
zstd = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[build-dependencies]
# build.rs: message.proto -> Rust; protox is a protobuf compiler in pure Rust,
# so the build machines need no `protoc`.
prost-build = "0.14"
protox = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# Virtual game controllers (uinput), same crate as lunaris-media.
evdev = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
# Virtual game controllers through the ViGEmBus driver.
vigem-client = "0.1.4"
# win_service.rs: the service that runs the host as SYSTEM in the console
# session (raw Win32 for the service itself, `windows-service` for install).
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    # rustdesk/input.rs: LockWorkStation.
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }



