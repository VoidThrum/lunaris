<!-- The Lunaris mark without its tile: the two computers of the app icon
     (assets/brand/lunaris.svg), for places that show the type of a computer
     next to the RustDesk and Sunshine logos. The white frames get a blue edge
     so that they show on a light page. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="152 109 800 800" role="img" aria-label="Lunaris">
<title>Lunaris</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#092b83"/><stop offset=".55" stop-color="#061c61"/><stop offset="1" stop-color="#030d36"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00449f"/><stop offset=".53" stop-color="#0754d6"/><stop offset="1" stop-color="#3028f7"/></linearGradient>
 <linearGradient id="frame" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".65" stop-color="#e7efff"/><stop offset="1" stop-color="#9abaff"/></linearGradient>
 <linearGradient id="link" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02d9f9"/><stop offset="1" stop-color="#00aaff"/></linearGradient>
 <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b35ff"/><stop offset="1" stop-color="#5b16f1"/></linearGradient>
</defs>
<!-- connection arc -->
<path d="M440 405 C500 272 682 280 740 390 C814 538 705 659 590 640" fill="none" stroke="url(#link)" stroke-width="39" stroke-linecap="round"/>
<!-- rear display -->
<rect x="533" y="242" width="403" height="288" rx="62" fill="url(#frame)" stroke="#2c4fa8" stroke-opacity=".55" stroke-width="10" paint-order="stroke"/>
<rect x="569" y="279" width="331" height="213" rx="29" fill="url(#screen)"/>
<path d="M895 281 L615 491 H868 Q900 491 900 458 V311 Q900 291 895 281" fill="#3575ff" opacity=".3"/>
<path d="M710 530 v35 h83 q22 0 22 18 t-22 18 H672" fill="url(#frame)" stroke="#2c4fa8" stroke-opacity=".55" stroke-width="10" paint-order="stroke"/>
<!-- front display -->
<rect x="168" y="424" width="432" height="284" rx="62" fill="url(#frame)" stroke="#2c4fa8" stroke-opacity=".55" stroke-width="10" paint-order="stroke"/>
<rect x="204" y="461" width="360" height="209" rx="29" fill="url(#screen)"/>
<path d="M561 464 L250 670 H535 Q564 670 564 640 V493 Q564 473 561 464" fill="#367aff" opacity=".3"/>
<path d="M345 708 v35 h85 v-35" fill="url(#frame)" stroke="#2c4fa8" stroke-opacity=".55" stroke-width="10" paint-order="stroke"/>
<rect x="286" y="740" width="205" height="36" rx="18" fill="url(#frame)" stroke="#2c4fa8" stroke-opacity=".55" stroke-width="10" paint-order="stroke"/>
<!-- connection hub -->
<circle cx="572" cy="478" r="65" fill="url(#frame)" stroke="#2c4fa8" stroke-opacity=".55" stroke-width="10" paint-order="stroke"/>
<circle cx="572" cy="478" r="36" fill="url(#node)"/>
</svg>
